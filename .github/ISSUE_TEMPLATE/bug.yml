name: "🐛 [결함/버그] Bug Report"
description: 기대 동작과 다르게 동작하는 결함이나 오류를 보고합니다.
title: "[결함] [서비스명] "
labels: ["Type: Bug"]
body:
  - type: markdown
    attributes:
      value: |
        일반 결함 및 기능 오류를 등록하는 템플릿입니다.
  - type: input
    id: service
    attributes:
      label: 서비스명
      placeholder: "예: 포털, D1, 보안서비스"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 발생 영역 (Layer)
      options:
        - "Layer: Back-end"
        - "Layer: Front-end"
        - "Layer: API"
        - "Layer: Core"
        - "Layer: Infra"
        - "Layer: 기타"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - "P2 Normal (일반 결함 - 현재 스프린트 내 처리)"
        - "P1 High (주요 결함 - 우회 수단 없음)"
        - "P3 Low (경미한 UI/문구 오류)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 현상 및 재현 방법
      description: 어떤 상황에서 오류가 발생하는지 상세히 설명하세요.
      placeholder: |
        1. 재현 순서:
        2. 기대 동작:
        3. 실제 동작:
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 사용자/운영 영향도
      placeholder: "사용자 화면 에러 노출, 결제 데이터 불일치 등"
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      value: |
        - [ ] 원인 분석 및 수정 코드 반영
        - [ ] 재현 시나리오 회귀 테스트 통과
        - [ ] 관련 PR에 `Closes #이슈번호` 연결
    validations:
      required: true
