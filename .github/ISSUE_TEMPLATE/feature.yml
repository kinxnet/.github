name: "🚀 [신규기능/고도화] Feature"
description: 새 고객 기능 개발, 계획된 고도화, API/UI 개선 작업을 등록합니다.
title: "[서비스명] "
labels: ["Type: Feature"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 개발 또는 계획된 고도화 작업을 등록하는 템플릿입니다.
        Findy Team+ 생산성 지표(투자 분류, 변경 리드타임)와 연계됩니다.
  - type: input
    id: service
    attributes:
      label: 서비스 / 프로젝트명
      description: 해당 기능이 속한 서비스명을 입력하세요. (예: 보안서비스, D1, IKS, 포털)
      placeholder: "예: 보안서비스"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 작업 영역 (Layer)
      description: 주된 변경 대상 레이어를 선택하세요.
      options:
        - "Layer: Back-end"
        - "Layer: Front-end"
        - "Layer: API"
        - "Layer: Core"
        - "Layer: Infra"
        - "Layer: Database"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 (Priority)
      options:
        - "P2 Normal (기본 계획 작업)"
        - "P1 High (핵심 로드맵 / 중요 기능)"
        - "P3 Low (경미한 개선 / 백로그)"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경 및 목적
      description: 해결하려는 문제와 사용자/운영 관점의 개발 목적을 설명하세요.
      placeholder: |
        - 기획 요청 근거:
        - 사용자 및 비즈니스 영향:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위 (Scope)
      description: 이번 이슈에서 구현할 범위와 제외할 범위를 명시하세요.
      placeholder: |
        - [포함] 
        - [제외] (후속 이슈로 분리)
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 기준 (Acceptance Criteria / DoD)
      description: 이 작업이 완료되었다고 판단할 수 있는 구체적인 검증 조건을 체크리스트로 작성하세요.
      value: |
        - [ ] 기능 구현 및 로컬/단위 테스트 통과
        - [ ] 관련 PR에 `Closes #이슈번호` 명시 및 연결
        - [ ] STAGE 환경 기능 검증 또는 리뷰어 확인 완료
    validations:
      required: true
  - type: input
    id: target_due
    attributes:
      label: 목표 완료일 (Due Date)
      description: 개발 및 1차 검증 완료 목표일 (YYYY-MM-DD)
      placeholder: "YYYY-MM-DD"
    validations:
      required: false
  - type: input
    id: docs_link
    attributes:
      label: 관련 문서 링크
      description: 기획서(Figma, Google Slides, Confluence), API 명세서 링크
      placeholder: "https://..."
